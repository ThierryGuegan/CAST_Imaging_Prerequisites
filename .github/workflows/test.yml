name: regression-sweep
on:
  pull_request:
  push:
    branches: [main]
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/syntax.js
      - run: node tests/lint.js
      - run: node tests/sweep.js --quick
      - run: node tests/facts.js
      - run: node tests/features.js
      - run: node tests/consistency.js --quick
      - run: node tests/profiles.js
      - run: node tests/diagram.js --quick
      - run: node tests/a11y.js
